<!doctype html>
<meta charset="utf-8">
<title>Closer</title>
<style>
  body { width: 300px; margin: 0; padding: 12px; font: 13px system-ui; color: #0f172a; }
  label { display: block; margin-top: 10px; font-weight: 600; }
  input[type=text], input[type=password], select { width: 100%; box-sizing: border-box; padding: 5px 6px; margin-top: 3px; }
  .row { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
  .row label { margin: 0; }
  small { color: #475569; display: block; margin-top: 3px; font-weight: 400; }
  button { margin-top: 12px; padding: 6px 10px; }
  details { margin-top: 12px; }
  #status { margin-top: 8px; color: #047857; }
  #state { padding: 8px; border-radius: 6px; background: #f1f5f9; }
</style>
<h3 style="margin:0 0 8px">Closer</h3>
<div id="state"></div>
<label>Which item are you selling in this chat?
  <select id="slug"></select>
</label>
<div class="row">
  <input id="auto" type="checkbox"><label for="auto">Auto-send replies</label>
</div>
<small>Off (recommended): Closer types a draft and you press send. On: it sends without you checking.</small>
<button id="save">Save</button>
<div id="status"></div>
<details>
  <summary>Advanced</summary>
  <label>Pairing token (only if one-click connect did not work)
    <input id="token" type="password" autocomplete="off" placeholder="clsr_...">
  </label>
  <label>Closer URL
    <input id="appUrl" type="text">
  </label>
  <button id="forget">Disconnect</button>
</details>
<script src="popup.js"></script>
